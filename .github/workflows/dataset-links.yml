name: dataset links

# A source that has moved is a number nobody can check. This runs weekly and opens
# nothing automatically; it fails loudly and a human decides what to do.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: collect every source url in the dataset
        run: |
          node -e "
            const fs = require('node:fs');
            const urls = new Set();
            const walk = (v) => {
              if (!v || typeof v !== 'object') return;
              if (typeof v.url === 'string' && v.publisher) urls.add(v.url);
              for (const child of Object.values(v)) walk(child);
            };
            for (const f of ['models','benchmarks','regions','equivalents','calibration']) {
              walk(JSON.parse(fs.readFileSync('packages/dataset/data/' + f + '.json', 'utf8')));
            }
            fs.writeFileSync('urls.txt', [...urls].sort().join('\n') + '\n');
            console.log('found ' + urls.size + ' distinct sources');
          "
          cat urls.txt

      - name: check each one responds
        run: |
          fail=0
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 -A 'betteruseofai-link-check' "$url" || echo 000)
            # Some sites answer 403 to any agent they do not recognise and 200 to a
            # browser. energysavingtrust.org.uk did on 2026-09-28. That is a site
            # that is up and blocks bots, not a dead source, so it is tried again
            # the way a browser would ask and reported as such.
            if [ "$code" = "403" ]; then
              again=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 -H 'Accept: text/html' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0 Safari/537.36' "$url" || echo 000)
              if [ "$again" -lt 400 ] && [ "$again" != "000" ]; then
                echo "ok    $again  $url  (answers a browser, blocks unknown agents)"
                continue
              fi
            fi
            if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
              echo "DEAD  $code  $url"
              fail=1
            else
              echo "ok    $code  $url"
            fi
          done < urls.txt
          exit $fail
