name: parity

# The two command line tools must produce the same bytes from the same logs.
# Nothing here reads a real home directory and nothing here contacts a network.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity (${{ matrix.os }}, node ${{ matrix.node }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        python: ['3.10', '3.13']
        include:
          # One extra Node version on Linux, to catch anything version specific
          # without paying for the whole matrix again.
          - os: ubuntu-latest
            node: 24
            python: '3.13'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5

      - run: pnpm install --frozen-lockfile

      - name: build the typescript side
        run: pnpm turbo run build

      - name: copy the dataset into the python package
        # This also recomputes the dataset hash and fails if the two sides would
        # ship different numbers.
        run: python apps/cli-py/scripts/sync-dataset.py

      - name: python checks
        working-directory: apps/cli-py
        run: |
          uv sync
          uv run ruff check .
          uv run pytest -q

      - name: compare the two tools byte for byte
        run: node fixtures/run-parity.mjs

      - name: keep the outputs when they disagree
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}-node${{ matrix.node }}-py${{ matrix.python }}
          path: fixtures/cli/output/
          retention-days: 7
