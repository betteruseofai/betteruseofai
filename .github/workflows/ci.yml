name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI may reach a live provider site or API. See PLAN.md section 9.
  BUAI_OFFLINE: '1'

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The whole job takes about two minutes. On the first run, one Windows job
    # sat in typecheck for over half an hour, and the default limit is six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap, and it catches a class of damage that is invisible in an editor:
      # an escape sequence that lost its backslash on the way through a shell.
      - run: node scripts/check-control-chars.mjs

      - run: pnpm turbo run build

      # The plugin bundle is tracked, because a marketplace install cannot
      # build. If this commit builds a different one, the commit is missing
      # a rebuild. Checked on one runner: esbuild output is deterministic for
      # a given input, and one check is enough to say so.
      - name: the committed plugin bundle is the one this commit builds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: git diff --exit-code apps/claude-code-plugin/dist

      - run: pnpm turbo run typecheck

      - run: pnpm turbo run test

  attribution:
    name: attribution rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every commit message on this branch, checked against the same matcher the hook uses.
      - name: check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          fail=0
          for sha in $(git rev-list "$base"..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! node scripts/check-commit-msg.mjs /tmp/msg.txt; then
              echo "offending commit: $sha"
              fail=1
            fi
          done
          exit $fail
