name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI may reach a live provider site or API. See PLAN.md section 9.
  BUOA_OFFLINE: '1'

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - run: pnpm turbo run typecheck

      - run: pnpm turbo run test

  attribution:
    name: attribution rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every commit message on this branch, checked against the same matcher the hook uses.
      - name: check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          fail=0
          for sha in $(git rev-list "$base"..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! node scripts/check-commit-msg.mjs /tmp/msg.txt; then
              echo "offending commit: $sha"
              fail=1
            fi
          done
          exit $fail
