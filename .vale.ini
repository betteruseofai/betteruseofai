# Vale 3.21.0. Pinned in docs/toolchain.md so CI runs the same binary.
#
# No Packages line on purpose. Everything here is ours and lives in styles/BUAI,
# so a checkout with no network still lints. The rules come from docs/STYLE.md
# and the voice they serve is in docs/VOICE.md.

StylesPath = styles
MinAlertLevel = warning

Vocab = BUAI

[*.{md,mdx}]
BasedOnStyles = BUAI

# Astro files are not linted directly. Vale has no parser for them, so it reads
# the JavaScript as prose and reports every `!==` as an exclamation mark and
# every `prefers-color-scheme` as an American spelling. apps/site/scripts/
# copy-lint.mjs runs Vale over the text extracted from the built pages instead,
# which is both quieter and more honest: it checks the words a reader sees.

# Working documents rather than site copy. They still get the word and dash
# rules, but the prose rules aimed at published pages would only make noise.
[{CHANGELOG.md,CONFLICTS.md,SECURITY.md,docs/toolchain.md,docs/dataset-contributing.md,docs/DECISIONS.md,docs/design/*.md,apps/*/README.md,packages/*/README.md}]
BasedOnStyles = BUAI
BUAI.Triplets = NO
BUAI.GenericCTA = NO
BUAI.Rhetorical = NO

# Three files are exempt from the word rules, each for the same reason: they
# have to name the things they ban.
#
#   STYLE.md   is the ban list.
#   VOICE.md   prints a bad example next to a good one on purpose.
#   PLAN.md    is the approved plan, quoting the ban list, and it is a record
#              of what was agreed rather than copy anyone reads on the site.
#              Editing it to pass a lint it predates would lose that.
[{docs/STYLE.md,docs/VOICE.md,PLAN.md}]
BasedOnStyles = BUAI
BUAI.Banned = NO
BUAI.Dashes = NO
BUAI.GenericCTA = NO
BUAI.NotButRather = NO
BUAI.Rhetorical = NO
BUAI.Triplets = NO
BUAI.Imagine = NO
BUAI.Navigate = NO
